<!DOCTYPE html>
<html lang="ms">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Daftar Akaun - Sistem LI</title><link rel="stylesheet" href="style.css"></head>
<body class="login-page register-page"><main class="register-shell"><section class="login-panel register-panel"><div class="brand"><span class="brand-mark">🎓</span><div><h1>Sistem LI</h1><p>Daftar akaun pelajar</p></div></div><div class="register-intro"><strong>Mulakan buku log digital anda</strong><span>Isi maklumat pelajar dan penempatan sekali sahaja.</span></div><form id="registerForm" class="login-form register-form"><div class="form-section-label">MAKLUMAT PELAJAR</div><div class="field"><label for="registerName">Nama penuh</label><input id="registerName" type="text" placeholder="Contoh: Ahmad Farhan" required></div><div class="field"><label for="registerMatrik">No. matrik</label><input id="registerMatrik" type="text" placeholder="Contoh: DKM03020001" required></div><div class="field-row"><div class="field"><label for="registerPassword">Kata laluan</label><input id="registerPassword" type="password" placeholder="Minimum 6 aksara" minlength="6" required></div><div class="field"><label for="registerConfirm">Sahkan kata laluan</label><input id="registerConfirm" type="password" placeholder="Ulang kata laluan" minlength="6" required></div></div><div class="field"><label for="registerProgram">Program / kursus</label><input id="registerProgram" type="text" value="Diploma Kejuruteraan Mekanikal" required></div><div class="form-section-label">MAKLUMAT PENEMPATAN LI</div><div class="field"><label for="registerCompany">Nama syarikat / industri</label><input id="registerCompany" type="text" placeholder="Contoh: Tech Solutions Sdn. Bhd." required></div><div class="field"><label for="registerAddress">Alamat syarikat</label><textarea id="registerAddress" rows="2" placeholder="Alamat penuh tempat latihan" required></textarea></div><div class="field-row"><div class="field"><label for="registerIndustrySupervisor">Penyelia industri</label><input id="registerIndustrySupervisor" type="text" placeholder="Nama penyelia" required></div><div class="field"><label for="registerSupervisorPhone">No. telefon penyelia</label><input id="registerSupervisorPhone" type="tel" placeholder="Contoh: 012-3456789"></div></div><div class="field-row"><div class="field"><label for="registerStart">Tarikh mula LI</label><input id="registerStart" type="date" required></div><div class="field"><label for="registerEnd">Tarikh tamat LI</label><input id="registerEnd" type="date" required></div></div><p id="registerMsg" class="error-msg" hidden></p><p id="registerSuccess" class="success-msg" hidden></p><button class="btn primary" type="submit">Daftar akaun</button><p class="auth-switch">Sudah ada akaun? <a href="index.html">Log masuk di sini</a></p></form></section></main><script src="app.js"></script></body></html>
